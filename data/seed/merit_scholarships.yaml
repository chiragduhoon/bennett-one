# Admission (merit) scholarship bands — Scholarship Policy AY 2026-27, Annexure A, pp. 7-9.
# Transcribed from the OCR of the official PDF and checked by hand (OCR artefacts fixed: "66=<" = ">=99",
# "56=<" = ">=95", "XI1%" = "XII%"). Ranges are inclusive. For ranks, LOWER is better (min/max are rank numbers).
# Scholarship % applies to the TUITION FEE only.
source:
  title: "Scholarship Policy AY 2026-27 — Annexure A: Admission Scholarship Bands"
  url: https://d2xwywryb7yxbo.cloudfront.net/s3bucket-images/Scholarship-Policy-26-27_compressed.pdf
terms:
  - "Scholarships under the Competitive Exam category apply only to students who passed out in December 2025/2026."
  - "Scholarships based on Class XII marks apply to students who passed out in 2025 and 2026."
  - "XII% is the Best of 3 subjects (same basis as the eligibility criteria)."
  - "Scores must be without any back / improvement / supplementary papers and UFM."
  - "Seats and scholarships are allocated first-come, first-served, subject to availability at the time of fee payment."

