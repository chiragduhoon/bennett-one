# BENNETT ONE gold evaluation set.
# Questions are REAL student wording taken from r/BennettUniversityGN (usernames removed).
# Expected answers come ONLY from official Bennett documents, never from Reddit replies,
# which were often wrong ("50% attendance is enough", "5k processing fee", "admissions never close").
#
# Fields
#   behavior:      answer | ask_details | refuse_or_redirect | decline_rule_evasion
#   must_mention:  keywords/numbers that must appear in the answer (case-insensitive, any one of each list group)
#   must_not:      myths/wrong claims that must NOT appear
#   source_hint:   which official document should be cited
#   who:           prospective | student
#   status:        verified (checked against official doc) | to_verify

- id: att-01
  q: "I currently have 70 percent attendance and am trying to make it 75 or above but what if at the end of the semester i am in 70s so what will be the consequences"
  who: student
  behavior: answer
  must_mention: [["75"], ["end semester", "end-semester", "end term", "examination"]]
  must_not: ["50% is enough", "no consequences", "anything works"]
  source_hint: "Notification for Minimum Attendance (BU/RO/307/2022)"
  status: verified

