[project]
name = "bennett-one-backend"
version = "0.1.0"
description = "BENNETT ONE API: agentic RAG over official university documents with a deterministic rule engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.5",
    "httpx>=0.28.1",
    "langgraph>=1.2.20",
    "openai>=3.49.0",
    "passlib[bcrypt]>=1.7.4",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.2",
    "pymupdf>=2.1",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.20.0",
    "rapidocr-onnxruntime>=1.4.4",
    "reportlab>=5.1.0",
    "sqlalchemy>=2.1.8",
    "sse-starlette>=3.7.0",
    "uvicorn[standard]>=0.54.0",
    "wordninja>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
[tool.pytest.ini_options]
pythonpath = ["."]
